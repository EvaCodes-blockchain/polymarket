name: polymarket-social

services:
  # Local EVM chain for the MVP (see documentation_polymarket_social/README.md,
  # "Architectural decisions"). Deterministic mnemonic so the account/role
  # mapping documented in testing-integration.md (Section 2.2) is stable:
  #   0 deployer/admin, 1 oracle resolver, 2-5 traders, 6 market creator.
  ganache:
    image: trufflesuite/ganache:v7.9.2
    command:
      - --chain.chainId=1337
      - --chain.networkId=1337
      - --wallet.mnemonic=justify social prediction market mvp test test test test test test junk
      - --wallet.totalAccounts=10
      - --wallet.defaultBalance=1000
      - --miner.blockTime=0
      - --server.host=0.0.0.0
      - --server.port=8545
      # Persist chain state. Without this the chain lives in memory and any
      # container restart wipes it while postgres-data survives — leaving DB
      # market rows pointing at contracts that no longer exist. With it,
      # deployed contracts + generated markets accumulate across deploys and
      # the idempotent contracts-deploy (see below) never re-deploys onto a
      # chain that already has them.
      - --database.dbPath=/ganache-data
    volumes:
      - ganache-data:/ganache-data
    ports:
      - "8545:8545"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_chainId\",\"params\":[]}'}).then(r=>r.json()).then(j=>process.exit(j.result==='0x539'?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Static server for the human-made HTML prototype (the source of truth for
  # product behavior). Served on :3001; port 3000 is reserved for the real
  # web client when it exists.
  prototype:
    image: nginx:1.27-alpine
    volumes:
      - ./html-polymarket-social-prototype:/usr/share/nginx/html:ro
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/index.html"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: justify
      POSTGRES_USER: justify
      POSTGRES_PASSWORD: justify
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justify -d justify"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── One-shot: deploy contracts to Ganache + write deployments/ganache.json ──
  # Runs `pnpm -F contracts deploy:ganache` against the compose Ganache node.
  # Exits 0 on success; the resulting ganache.json is written to a shared
  # volume so the web service can read canonical addresses at runtime.
  # Start manually with: docker compose run --rm contracts-deploy
  # Or bring the whole stack including this service:
  #   docker compose --profile deploy up
  contracts-deploy:
    profiles:
      - deploy
    build:
      context: .
      dockerfile: contracts/Dockerfile
    environment:
      RPC_URL: http://ganache:8545
      GANACHE_MNEMONIC: "justify social prediction market mvp test test test test test test junk"
    volumes:
      - contracts-deployments:/app/contracts/deployments
    depends_on:
      ganache:
        condition: service_healthy
    restart: "no"

  # ── Next.js web app ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the browser bundle at build time.
        # Override these when deploying to a remote host, e.g.:
        #   NEXT_PUBLIC_RPC_URL=http://1.2.3.4:8545 docker compose up --build
        # Defaults keep the local dev workflow working without any .env file.
        NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
        NEXT_PUBLIC_RPC_URL: "${NEXT_PUBLIC_RPC_URL:-http://localhost:8545}"
        NEXT_PUBLIC_CHAIN_ID: "${NEXT_PUBLIC_CHAIN_ID:-1337}"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://justify:justify@postgres:5432/justify"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-in-production}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NEXT_PUBLIC_RPC_URL: "${NEXT_PUBLIC_RPC_URL:-http://localhost:8545}"
      NEXT_PUBLIC_CHAIN_ID: "${NEXT_PUBLIC_CHAIN_ID:-1337}"
      # Server-side chain access (web/src/lib/server/chain.ts): signs market
      # creation + faucet txs against the compose Ganache node.
      RPC_URL: "http://ganache:8545"
      GANACHE_MNEMONIC: "justify social prediction market mvp test test test test test test junk"
      # Shared secret for the market generator's x-generator-key header
      # (web/src/lib/server/generatorAuth.ts). Dev default only — set a real
      # value in any shared environment.
      GENERATOR_API_KEY: "${GENERATOR_API_KEY:-dev-generator-key}"
      # Canonical deployment artifact, written by the one-shot contracts-deploy
      # service into the shared volume below. Read by web/src/lib/server/chain.ts
      # and prisma/seed.ts — the image itself ships no contracts/ directory, so
      # without this mount server-side chain access cannot resolve addresses.
      DEPLOYMENTS_FILE: "/deployments/ganache.json"
    volumes:
      - contracts-deployments:/deployments:ro
    depends_on:
      postgres:
        condition: service_healthy
      ganache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://0.0.0.0:3000/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Market generator (test/demo component) ──────────────────────────────────
  # News-driven market creation bots — see
  # documentation_polymarket_social/testing-market-generator.md. OFF by default
  # per spec (Section 2): opt in with the `generator` profile:
  #   docker compose --profile generator up -d
  # or build/start just this service:
  #   docker compose --profile generator up -d --build market-generator
  # Opting into the profile IS the master switch, hence GENERATOR_ENABLED=true
  # inside the service. All knobs per spec Section 7; ${VAR:-default} ones are
  # host-overridable, catalog in web/.env.example.
  market-generator:
    profiles:
      - generator
    build:
      context: .
      dockerfile: generator/Dockerfile
    environment:
      GENERATOR_ENABLED: "true"
      NEWS_SOURCE: "${NEWS_SOURCE:-fixture}"
      NEWS_TOPICS: "${NEWS_TOPICS:-WORLD,BUSINESS,TECHNOLOGY,SPORTS,SCIENCE,ENTERTAINMENT,HEALTH}"
      POLL_INTERVAL: "${POLL_INTERVAL:-15m}"
      MARKETS_PER_HOUR: "${MARKETS_PER_HOUR:-12}"
      MAX_LIVE_MARKETS: "${MAX_LIVE_MARKETS:-100}"
      CLOSE_WINDOW: "${CLOSE_WINDOW:-1d-30d}"
      GENERATOR_TRADING: "${GENERATOR_TRADING:-off}"
      GENERATOR_SEED: "${GENERATOR_SEED:-}"
      # Targets are compose-internal hostnames. The generator's environment
      # lock allowlists localhost/127.0.0.1/*.test/*.staging only, so `web`
      # must be admitted explicitly via EXTRA_ALLOWED_HOSTS.
      API_BASE_URL: "http://web:3000"
      EXTRA_ALLOWED_HOSTS: "web"
      RPC_URL: "http://ganache:8545"
      GENERATOR_API_KEY: "${GENERATOR_API_KEY:-dev-generator-key}"
      # Same mnemonic as the ganache service — bot traders are accounts 7-9.
      GANACHE_MNEMONIC: "justify social prediction market mvp test test test test test test junk"
      # Deployment artifact from the shared volume (see volumes below) so a
      # contract redeploy never requires an image rebuild.
      DEPLOYMENTS_FILE: "/deployments/ganache.json"
    volumes:
      # Canonical artifact written by the contracts-deploy one-shot — the same
      # volume the web service reads, so generator and web always agree on
      # contract addresses (the committed repo artifact can drift, see
      # DeployRunbook.md §2.5).
      - contracts-deployments:/deployments:ro
      # Dedup store (generator/.state/dedup.json). Persisted so re-running the
      # generator on each deploy only creates markets for headlines it has not
      # used yet — "create if not created" across builds.
      - generator-state:/app/generator/.state
    depends_on:
      web:
        condition: service_healthy
      ganache:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  contracts-deployments:
  generator-state:
  ganache-data:
