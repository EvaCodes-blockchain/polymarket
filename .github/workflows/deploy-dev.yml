name: Deploy Dev

# Triggered on every push to mvp (= merged PR).
# Connects to the dev VPS via SSH and runs:
#   git reset --hard origin/mvp  →  docker compose up --build  →  contracts-deploy
#   →  reconcile + seed test users (founder, demo users, bots — idempotent)
#   →  one market-generator cycle (test markets; dedup state persists across
#      deploys, so only headlines not used by a previous deploy create markets)
#
# Required GitHub Actions Secrets (set in repo Settings → Secrets → Actions):
#   DEV_HOST   — e.g.  ubuntu@13.219.132.201
#   DEV_SSH_KEY — PEM / OpenSSH private key that can SSH to DEV_HOST
#
# If the secrets are absent the job fails immediately with a clear message
# rather than silently hanging.

on:
  push:
    branches:
      - mvp

concurrency:
  # One deploy at a time; do NOT cancel in-progress — let the running deploy
  # finish so the VPS is never left mid-update.
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy → dev VPS
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets are present
        run: |
          if [ -z "${{ secrets.DEV_HOST }}" ]; then
            echo "::error::Secret DEV_HOST is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.DEV_SSH_KEY }}" ]; then
            echo "::error::Secret DEV_SSH_KEY is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: Add VPS host key to known_hosts
        run: |
          HOST=$(echo "${{ secrets.DEV_HOST }}" | cut -d@ -f2)
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          # Ship the deploy script to the host as a FILE, then execute it with
          # stdin detached (`bash script </dev/null`). Do NOT pipe it over
          # stdin (`bash -s` + heredoc): the body then lives on stdin, and any
          # `docker compose run`/`exec` inside reads from that same stream and
          # swallows the rest of the script — the deploy exits 0 having run
          # only the commands before the first such call. With the body in a
          # file, nothing can consume it.
          ssh "$DEV_HOST" 'cat > /tmp/deploy-dev.sh' << 'ENDSSH'
            set -euo pipefail
            cd ~/polymarket

            echo "==> Fetching latest mvp..."
            git fetch origin
            git checkout mvp 2>/dev/null || true
            git reset --hard origin/mvp

            # Load host-local config (.env must exist, chmod 600, NOT in repo).
            # DEPLOY_TARGET (ganache|arc) selects the chain mode; defaults to
            # ganache. On Arc the .env also carries NEXT_PUBLIC_CHAIN_ID=5042002,
            # RPC_URL=https://rpc.testnet.arc.network, etc.
            if [ -f .env ]; then
              set -a; source .env; set +a
            fi
            DEPLOY_TARGET="${DEPLOY_TARGET:-ganache}"
            echo "==> Deploy target: $DEPLOY_TARGET"

            echo "==> Building and starting compose stack..."
            export NEXTAUTH_URL="http://$(curl -sf http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || hostname -I | awk '{print $1}'):3000"
            if [ "$DEPLOY_TARGET" = "ganache" ]; then
              # Bake the public VPS IP into the browser bundle so wagmi/viem in
              # the browser talk to the VPS Ganache node. On Arc, NEXT_PUBLIC_RPC_URL
              # comes from .env (the public Arc RPC) — don't override it here.
              export NEXT_PUBLIC_RPC_URL="http://$(curl -sf http://169.254.169.254/latest/meta-data/public-ipv4 2>/dev/null || hostname -I | awk '{print $1}'):8545"
            fi

            docker compose up -d --build --remove-orphans

            if [ "$DEPLOY_TARGET" = "arc" ]; then
              # Contracts are already deployed on Arc; the committed artifact
              # (contracts/deployments/arc.json) is the source of truth. Don't
              # run contracts-deploy (it's pinned to --network ganache and would
              # burn gas re-deploying). Just publish the artifact into the shared
              # volume under the name web reads (DEPLOYMENTS_FILE → ganache.json).
              echo "==> Arc: publishing committed arc.json into the deployments volume (no on-chain deploy)..."
              docker run --rm \
                -v polymarket-social_contracts-deployments:/d \
                -v "$PWD/contracts/deployments:/src:ro" \
                alpine sh -c 'cp /src/arc.json /d/ganache.json && echo "  ✓ arc.json -> volume/ganache.json"'
            else
              echo "==> Ganache: running one-shot contracts deploy..."
              # Explicit build: `up --build` only builds services it starts, and
              # profile-gated one-shots are not among them. The deploy script is
              # idempotent (skips when the artifact's MarketFactory already has
              # code on the persisted chain), so a real failure here must fail
              # the deploy — seeding against a stale artifact is worse than no
              # deploy.
              docker compose --profile deploy build contracts-deploy
              # -T: no TTY in CI (script body is in a file, not on stdin).
              docker compose --profile deploy run --rm -T contracts-deploy
            fi

            # web caches the deployments artifact lazily (chain.ts) — restart it
            # so it picks up the artifact in the shared volume.
            echo "==> Restarting web to pick up the deployments artifact..."
            docker compose restart web

            echo "==> Waiting for web healthcheck..."
            WEB_HEALTHY=0
            for i in $(seq 1 24); do
              if docker compose ps web | grep -q "(healthy)"; then
                echo "Web is healthy."
                WEB_HEALTHY=1
                break
              fi
              echo "  ...waiting ($i/24)"
              sleep 5
            done

            if [ "$WEB_HEALTHY" -ne 1 ]; then
              echo "::error::Web did not become healthy — skipping test-data seeding."
              docker compose ps
              docker compose logs --tail 100 web
              exit 1
            fi

            # ── Test data: reconcile then seed users ────────────────────────
            # reconcile-markets.ts drops DB market rows whose contracts no
            # longer exist on the chain (only happens if the ganache-data
            # volume was reset while postgres-data survived); without it,
            # stale rows collide with fresh on-chain marketIds and block all
            # new markets. Then the two idempotent seeds (upserts /
            # skipDuplicates) create only what is missing: seed.ts first
            # (founder + El Clásico backfill — needs DEPLOYMENTS_FILE), then
            # seed-users.ts (demo users + bots + follow graph around the
            # founder).
            echo "==> Reconciling markets + seeding test users..."
            docker compose exec -T web sh -c 'cd /app/web \
              && npx tsx prisma/reconcile-markets.ts \
              && npx tsx prisma/seed.ts \
              && npx tsx prisma/seed-users.ts'

            # ── Test data: markets (Ganache only) ───────────────────────────
            # One generator cycle (--once via `generate`). The dedup store lives
            # on the generator-state volume, so each deploy only creates markets
            # for headlines not used by a previous deploy. Exits 0 even when no
            # markets are created (caps reached / all deduped).
            # Skipped on Arc: creating markets there is a real on-chain tx that
            # burns gas-USDC, so generated markets are added manually/deliberately.
            if [ "$DEPLOY_TARGET" = "arc" ]; then
              echo "==> Arc: skipping market generator (on-chain creation burns gas — run manually)."
            else
              echo "==> Generating test markets (one generator cycle)..."
              docker compose --profile generator build market-generator
              docker compose --profile generator run --rm -T \
                market-generator pnpm -F generator generate
            fi

            docker compose ps
          ENDSSH

          echo "==> Executing deploy script on VPS (stdin detached)..."
          ssh "$DEV_HOST" 'bash /tmp/deploy-dev.sh' < /dev/null

      - name: Smoke-check web from runner
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          HOST=$(echo "$DEV_HOST" | cut -d@ -f2)
          echo "Checking http://$HOST:3000/ ..."
          curl --fail --silent --max-time 15 "http://$HOST:3000/" | grep -q "Justify\|Next\|html" \
            && echo "✓ Web responded OK" \
            || (echo "✗ Web did not respond"; exit 1)
